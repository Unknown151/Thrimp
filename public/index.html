<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrimp</title>
<style>
  :root {
    --panel: rgba(24, 20, 37, 0.88);
    --line: #3a4466;
    --text: #ead4aa;
    --dim: #8b9bb4;
    --accent: #feae34;
    --good: #63c74d;
    --warn: #feae34;
    --bad: #e43b44;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #181425; }
  body { font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--text); }
  canvas#view { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas#view.dragging { cursor: grabbing; }
  .panel {
    position: absolute; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; user-select: none;
  }
  .dim { color: var(--dim); }
  #hud { top: 10px; left: 10px; min-width: 210px; }
  #hud .place { color: var(--accent); font-weight: bold; font-size: 15px; }
  #speed { top: 10px; right: 10px; display: flex; gap: 4px; padding: 6px; }
  button {
    font: inherit; color: var(--text); background: #262b44; border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 8px; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button.on { background: var(--accent); color: #181425; border-color: var(--accent); }
  #inspector { top: 56px; right: 10px; width: 260px; display: none; }
  #inspector .head { display: flex; justify-content: space-between; align-items: center; }
  #inspector .name { color: var(--accent); font-weight: bold; font-size: 16px; }
  #inspector .doing { margin-top: 8px; font-weight: bold; }
  #inspector .sect { margin-top: 10px; color: var(--dim); text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
  .need { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 6px; margin-top: 4px; }
  .bar { height: 8px; background: #262b44; border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; }
  #i-recent { margin: 4px 0 0; padding: 0; list-style: none; max-height: 150px; overflow: hidden; }
  #i-recent li { color: var(--dim); }
  #i-recent li b { color: var(--text); font-weight: normal; }
  #inspector .actions { margin-top: 10px; display: flex; gap: 6px; }
  #help { bottom: 10px; left: 10px; color: var(--dim); font-size: 12px; max-width: calc(100vw - 40px); }
  @media (max-width: 640px) {
    #inspector { top: auto; bottom: 10px; right: 10px; left: 10px; width: auto; }
    #help { display: none; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="panel">
  <div class="place" id="hud-place"></div>
  <div id="hud-clock"></div>
  <div class="dim"><span id="hud-pop"></span> · <span id="hud-food"></span> · <span id="hud-wood"></span></div>
</div>

<div id="speed" class="panel">
  <button data-speed="0" title="Pause (Space)">II</button>
  <button data-speed="1" title="Normal speed (1)">1×</button>
  <button data-speed="2" title="Fast (2)">3×</button>
  <button data-speed="3" title="Faster (3)">6×</button>
  <button data-speed="4" title="Fastest (4)">12×</button>
</div>

<div id="inspector" class="panel">
  <div class="head"><span class="name" id="i-name"></span><button id="i-close" title="Close (Esc)">×</button></div>
  <div class="dim" id="i-home"></div>
  <div class="doing" id="i-doing"></div>
  <div class="dim" id="i-why"></div>
  <div class="sect">Needs</div>
  <div class="need"><span>Food</span><div class="bar"><i id="i-food"></i></div></div>
  <div class="need"><span>Rest</span><div class="bar"><i id="i-rest"></i></div></div>
  <div class="need"><span>Fun</span><div class="bar"><i id="i-fun"></i></div></div>
  <div class="dim" id="i-carry" style="margin-top:8px"></div>
  <div class="dim" id="i-likes"></div>
  <div class="sect">Recently</div>
  <ul id="i-recent"></ul>
  <div class="actions"><button id="i-follow">Follow (F)</button></div>
</div>

<div id="help" class="panel">Drag to pan · Scroll to zoom · Click a Thrimp · Space pause · 1–4 speed · F follow · G debug</div>

<script>
'use strict';
// Thrimp: a colony sim. See thrimp-design.md for the design.
// Build step 1 (sandbox): one place, a handful of Thrimps with needs walking a home / work / canteen loop.

// ============================================================
// CONFIG / CONSTANTS
// ============================================================
const CONFIG = {
  WORLD_W: 1600, WORLD_H: 1100,   // art pixels; the camera zooms these up
  TICK_HZ: 20,                    // sim ticks per real second at 1x
  MIN_PER_TICK: 0.2,              // game minutes per tick: one game day ≈ 6 real minutes at 1x
  MAX_STEPS_PER_FRAME: 240,
  SPEEDS: [0, 1, 3, 6, 12],
  ZOOMS: [1, 1.5, 2, 3, 4, 6],
  START_THRIMPS: 12,
  START_HOUR: 6.5,
  START_FOOD: 16,
  CELL: 8,                        // invisible walk grid for solids (data only, never drawn)
  NODE_SPACING: 56,               // path network density
  WALK_SPEED: 7,                  // art px per game minute
  WALK_PX_PER_FRAME: 3.5,         // walk animation advances with distance, so feet keep pace with the ground
  IDLE_MIN_PER_FRAME: 1.5,        // breathing advances with game time, so it pauses and speeds up with the sim
};
const HOUR = 60, DAY = 24 * HOUR;
const MAP_W = CONFIG.WORLD_W, MAP_H = CONFIG.WORLD_H;

// All art is locked to the Endesga 32 palette (lospec.com/palette-list/endesga-32); these are its colours by role.
const P = {
  outline: '#181425', night: '#262b44', white: '#ffffff', skin: '#e8b796',
  grass: ['#193c3e', '#265c42', '#3e8948', '#63c74d'],
  dirt:  ['#3e2731', '#733e39', '#b86f50', '#e4a672'],
  water: ['#124e89', '#0099db', '#2ce8f5', '#ffffff'],
  bark:  ['#3e2731', '#733e39'],
  leaf:  ['#193c3e', '#265c42', '#3e8948', '#63c74d'],
  berry: ['#a22633', '#e43b44'],
  wall:  ['#c28569', '#e4a672', '#ead4aa'],
  roof:  ['#3e2731', '#733e39', '#be4a2f'],
  stone: ['#5a6988', '#8b9bb4', '#c0cbdc'],
  flower: ['#fee761', '#f6757a', '#c0cbdc', '#b55088'],
  light: ['#f77622', '#feae34', '#fee761'],
};

// PixelLab sprite sheets: one row per direction (in this order), one column per frame.
const SHEET_DIRS = ['south', 'south-east', 'east', 'north-east', 'north', 'north-west', 'west', 'south-west'];
const THRIMP_SHEETS = { idle: 'assets/thrimp/idle.png', walk: 'assets/thrimp/walk.png' };

const BUILDING_TYPES = {
  hut:        { label: 'Hut',        w: 54, h: 30 },
  canteen:    { label: 'Canteen',    w: 100, h: 38 },
  lumberyard: { label: 'Lumberyard', w: 52, h: 14 },
};

// Screen directions in atan2 order (east = 0, clockwise because y points down).
const DIRS = ['east', 'south-east', 'south', 'south-west', 'west', 'north-west', 'north', 'north-east'];

// ============================================================
// RNG + HELPERS
// ============================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Every run is different (design pillar 5); the seed only exists so a save can rebuild the same world.
const SEED = crypto.getRandomValues(new Uint32Array(1))[0];
const rand = mulberry32(SEED);
const randRange = (a, b) => a + rand() * (b - a);
const randInt = (a, b) => Math.floor(randRange(a, b + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];
const chance = p => rand() < p;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const hexRgb = hex => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
const rectsOverlap = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER4[((y & 3) << 2) | (x & 3)];

function weightedPick(items, weightFn) {
  let total = 0;
  const ws = items.map(it => { const w = Math.max(0, weightFn(it)); total += w; return w; });
  if (total <= 0) return null;
  let r = rand() * total;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

const hourOf = t => (t / HOUR) % 24;
const dayOf = t => Math.floor(t / DAY) + 1;
function fmtClock(t) {
  const m = Math.floor(t) % DAY;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function periodName(h) {
  return h < 5 ? 'Night' : h < 7 ? 'Dawn' : h < 11 ? 'Morning' : h < 14 ? 'Midday'
    : h < 18 ? 'Afternoon' : h < 21 ? 'Evening' : 'Night';
}

function makeNoise() {
  const perm = new Uint8Array(256).map((_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const vals = Float32Array.from({ length: 256 }, () => rand());
  const h = (x, y) => vals[perm[(perm[x & 255] + y) & 255]];
  const s = t => t * t * (3 - 2 * t);
  function value(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = s(x - ix), fy = s(y - iy);
    return lerp(lerp(h(ix, iy), h(ix + 1, iy), fx), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), fx), fy);
  }
  return (x, y, octaves = 3) => {
    let sum = 0, amp = 1, f = 1, norm = 0;
    for (let o = 0; o < octaves; o++) { sum += value(x * f, y * f) * amp; norm += amp; amp *= 0.5; f *= 2.03; }
    return sum / norm;
  };
}

// Smooth scalar fields sampled on a coarse grid and read back bilinearly.
const FIELD_STEP = 4;
function makeField(fn) {
  const fw = Math.ceil(MAP_W / FIELD_STEP) + 2, fh = Math.ceil(MAP_H / FIELD_STEP) + 2;
  const data = new Float32Array(fw * fh);
  for (let j = 0; j < fh; j++) for (let i = 0; i < fw; i++) data[j * fw + i] = fn(i * FIELD_STEP, j * FIELD_STEP);
  return { fw, fh, data };
}
function sampleField(f, x, y) {
  const gx = clamp(x / FIELD_STEP, 0, f.fw - 1.001), gy = clamp(y / FIELD_STEP, 0, f.fh - 1.001);
  const i = Math.floor(gx), j = Math.floor(gy), tx = gx - i, ty = gy - j, d = f.data, w = f.fw;
  return lerp(lerp(d[j * w + i], d[j * w + i + 1], tx), lerp(d[(j + 1) * w + i], d[(j + 1) * w + i + 1], tx), ty);
}

class MinHeap {
  constructor() { this.items = []; this.pri = []; }
  get size() { return this.items.length; }
  push(item, p) {
    const it = this.items, pr = this.pri;
    let i = it.length; it.push(item); pr.push(p);
    while (i > 0) {
      const parent = (i - 1) >> 1;
      if (pr[parent] <= p) break;
      it[i] = it[parent]; pr[i] = pr[parent]; i = parent;
    }
    it[i] = item; pr[i] = p;
  }
  pop() {
    const it = this.items, pr = this.pri, top = it[0];
    const lastI = it.pop(), lastP = pr.pop(), n = it.length;
    if (n) {
      let i = 0;
      for (;;) {
        let c = 2 * i + 1;
        if (c >= n) break;
        if (c + 1 < n && pr[c + 1] < pr[c]) c++;
        if (pr[c] >= lastP) break;
        it[i] = it[c]; pr[i] = pr[c]; i = c;
      }
      it[i] = lastI; pr[i] = lastP;
    }
    return top;
  }
}

// ============================================================
// NAMES
// ============================================================
const NAME_ON = ['P', 'B', 'M', 'V', 'T', 'D', 'N', 'K', 'G', 'R', 'S', 'L', 'F', 'H', 'W', 'Z', 'Br', 'Gr', 'Sk', 'Th', 'Sn', 'Pl', 'Tr', 'Fl', 'Gl', 'Dr', 'Wr'];
const NAME_VO = ['a', 'e', 'i', 'o', 'u', 'ee', 'oo', 'ai', 'y', 'ou'];
const NAME_CO = ['b', 't', 'x', 'k', 'tt', 'll', 'p', 'm', 'n', 'g', 'sh', 'ck', 'ss', 'rr', 'd', 'b'];
const NAME_END = ['a', 'o', 'in', 'et', 'y', 'ie', 'um', 'el'];
function makeName(taken) {
  for (let i = 0; i < 100; i++) {
    let n = pick(NAME_ON) + pick(NAME_VO) + pick(NAME_CO);
    if (chance(0.3)) n += pick(NAME_END);
    if (!taken.has(n)) { taken.add(n); return n; }
  }
  return 'Thrimp ' + taken.size;
}
const PLACE_ADJ = ['Ash', 'Drowned', 'Grey', 'Low', 'Bitter', 'Mossy', 'Crooked', 'Still', 'Rotten', 'Quiet', 'Sunken', 'Old'];
const PLACE_NOUN = ['Hollow', 'Ridge', 'Wood', 'Fen', 'Dell', 'Mire', 'Reach', 'Brook', 'Knoll', 'Bottom', 'Meadow'];
function makePlaceName() {
  const n = pick(PLACE_NOUN), a = pick(PLACE_ADJ);
  return pick([`The ${n}`, `${a} ${n}`, `The ${a} ${n}`]);
}

// ============================================================
// WORLD: terrain, buildings, resources, path network
// ============================================================
function isWater(world, x, y) { return sampleField(world.waterF, x, y) > world.waterT; }
function isBlocked(world, x, y) {
  if (x < 6 || y < 10 || x > MAP_W - 6 || y > MAP_H - 4) return true;
  if (world.solid[Math.floor(y / CONFIG.CELL) * world.gw + Math.floor(x / CONFIG.CELL)]) return true;
  return sampleField(world.waterF, x, y) > world.waterT - 0.004; // keep feet off the waterline
}
function markSolid(world, x0, y0, x1, y1) {
  const C = CONFIG.CELL;
  for (let cy = Math.floor(y0 / C); cy <= Math.floor(y1 / C); cy++)
    for (let cx = Math.floor(x0 / C); cx <= Math.floor(x1 / C); cx++)
      if (cx >= 0 && cy >= 0 && cx < world.gw && cy < world.gh) world.solid[cy * world.gw + cx] = 1;
}
// The start point is skipped so a Thrimp standing on an awkward spot can always walk away from it.
function segmentClear(world, x0, y0, x1, y1) {
  const n = Math.max(1, Math.ceil(dist(x0, y0, x1, y1) / 4));
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    if (isBlocked(world, lerp(x0, x1, t), lerp(y0, y1, t))) return false;
  }
  return true;
}
function dirtValue(world, x, y) {
  let v = 0;
  for (const s of world.dirtSpots) v = Math.max(v, 1 - (((x - s.x) / s.rx) ** 2 + ((y - s.y) / s.ry) ** 2));
  return v;
}

function placeBuilding(world, type, x, y, side = 12, front = 18) {
  const T = BUILDING_TYPES[type];
  x = Math.round(x); y = Math.round(y);
  const rect = { x0: x - T.w / 2 - side, x1: x + T.w / 2 + side, y0: y - T.h - 10, y1: y + front };
  if (rect.x0 < 24 || rect.x1 > MAP_W - 24 || rect.y0 < 48 || rect.y1 > MAP_H - 20) return null;
  if (world.noBuild.some(r => rectsOverlap(r, rect))) return null;
  for (let yy = rect.y0; yy <= rect.y1; yy += 4)
    for (let xx = rect.x0; xx <= rect.x1; xx += 4)
      if (isWater(world, xx, yy) || world.solid[Math.floor(yy / CONFIG.CELL) * world.gw + Math.floor(xx / CONFIG.CELL)]) return null;
  const b = { id: world.nextId++, type, label: T.label, x, y, w: T.w, h: T.h, door: { x, y: y + 5 }, sleepers: [] };
  world.noBuild.push(rect);
  markSolid(world, x - T.w / 2, y - T.h, x + T.w / 2 - 1, y - 1);
  world.buildings.push(b);
  world.byId.set(b.id, b);
  world.dirtSpots.push({ x, y: y + 7, rx: 10, ry: 6 });
  return b;
}

function generateWorld() {
  for (let attempt = 0; attempt < 8; attempt++) {
    const world = tryGenerateWorld();
    if (world) return world;
  }
  throw new Error('Could not generate a playable world');
}

function tryGenerateWorld() {
  const world = {
    seed: SEED, time: CONFIG.START_HOUR * HOUR, tick: 0,
    placeName: makePlaceName(),
    stock: { food: CONFIG.START_FOOD, wood: 0 },
    buildings: [], byId: new Map(), trees: [], bushes: [], thrimps: [],
    tables: [], seats: [], shoreSpots: [], noBuild: [], dirtSpots: [],
    names: new Set(), nextId: 1,
  };
  const fbmWater = makeNoise(), fbmForest = makeNoise(), fbmTint = makeNoise();
  const cx = MAP_W * randRange(0.42, 0.58), cy = MAP_H * randRange(0.42, 0.58);
  world.center = { x: cx, y: cy };
  const keepClear = (x, y) => Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * 230 ** 2));
  const edge = (x, y) => clamp(1 - Math.min(x, MAP_W - x, y, MAP_H - y) / 240, 0, 1);

  world.waterF = makeField((x, y) => fbmWater(x / 300, y / 300) - 0.55 * keepClear(x, y));
  const sorted = Float32Array.from(world.waterF.data).sort();
  world.waterT = sorted[Math.floor(sorted.length * 0.9)]; // ~10% of the map is water
  world.forestF = makeField((x, y) => clamp(fbmForest(x / 200, y / 200) * 0.9 + edge(x, y) * 0.75 - 0.35 - 0.6 * keepClear(x, y), 0, 1));
  world.tintF = makeField((x, y) => fbmTint(x / 90, y / 90));

  world.gw = Math.ceil(MAP_W / CONFIG.CELL);
  world.gh = Math.ceil(MAP_H / CONFIG.CELL);
  world.solid = new Uint8Array(world.gw * world.gh);

  // Canteen at the heart of the settlement, with tables and a food store out front.
  let canteen = null;
  for (let i = 0; i < 300 && !canteen; i++) {
    const spread = i / 3;
    canteen = placeBuilding(world, 'canteen', cx + randRange(-spread, spread), cy + randRange(-spread, spread), 32, 46);
  }
  if (!canteen) return null;
  world.canteen = canteen;
  const ty = canteen.y + 26;
  for (const tx of [canteen.x - 24, canteen.x + 24]) {
    world.tables.push({ x: tx, y: ty });
    for (const sx of [-5, 5]) {
      world.seats.push({ x: tx + sx, y: ty - 6, face: 'south', takenBy: 0 });
      world.seats.push({ x: tx + sx, y: ty + 6, face: 'north', takenBy: 0 });
    }
  }
  world.dirtSpots.push({ x: canteen.x, y: ty, rx: 46, ry: 16 });
  world.crate = { x: canteen.x + canteen.w / 2 + 14, y: canteen.y + 4 };
  world.store = { x: world.crate.x, y: world.crate.y + 7 };

  // Lumberyard out toward the thickest woods.
  let bestAng = 0, bestF = -1;
  for (let a = 0; a < 24; a++) {
    const ang = a / 24 * Math.PI * 2;
    const f = sampleField(world.forestF, cx + Math.cos(ang) * 380, cy + Math.sin(ang) * 300);
    if (f > bestF) { bestF = f; bestAng = ang; }
  }
  let yard = null;
  for (let i = 0; i < 400 && !yard; i++) {
    const ang = bestAng + randRange(-0.6, 0.6), r = randRange(220, 330);
    yard = placeBuilding(world, 'lumberyard', cx + Math.cos(ang) * r, cy + Math.sin(ang) * r * 0.8, 16, 22);
  }
  if (yard) {
    yard.drop = { x: yard.x, y: yard.y + 9 };
    world.lumberyard = yard;
    world.dirtSpots.push({ x: yard.x, y: yard.y + 4, rx: 30, ry: 12 });
  }

  // Huts scattered loosely around the canteen.
  const nHuts = Math.ceil(CONFIG.START_THRIMPS / 2);
  for (let k = 0; k < nHuts; k++) {
    for (let i = 0; i < 400; i++) {
      const ang = rand() * Math.PI * 2, r = randRange(100, 250);
      const hut = placeBuilding(world, 'hut', cx + Math.cos(ang) * r * 1.3, cy + Math.sin(ang) * r * 0.85);
      if (hut) { hut.label = `Hut ${k + 1}`; break; }
    }
  }

  // Trees: thick toward the edges, a few strays in the open.
  const treeBuckets = new Map(), TB = 32, tcols = Math.ceil(MAP_W / TB);
  const nearTree = (x, y, r) => {
    const bx = Math.floor(x / TB), by = Math.floor(y / TB), k = Math.ceil(r / TB);
    for (let j = by - k; j <= by + k; j++) for (let i = bx - k; i <= bx + k; i++) {
      if (i < 0 || j < 0 || i >= tcols) continue;
      for (const t of treeBuckets.get(i + j * tcols) || []) if ((t.x - x) ** 2 + (t.y - y) ** 2 < r * r) return true;
    }
    return false;
  };
  for (let i = 0; i < 16000 && world.trees.length < 900; i++) {
    const x = Math.round(randRange(10, MAP_W - 10)), y = Math.round(randRange(30, MAP_H - 6));
    const f = sampleField(world.forestF, x, y);
    if (rand() > f * f * 1.5 + 0.004) continue;
    if (isWater(world, x, y) || isWater(world, x, y - 8) || dist(x, y, cx, cy) < 160) continue;
    if (world.noBuild.some(r => x > r.x0 - 12 && x < r.x1 + 12 && y > r.y0 - 4 && y < r.y1 + 30)) continue;
    if (nearTree(x, y, lerp(30, 13, f))) continue;
    const tree = { id: world.nextId++, x, y, kind: f > 0.55 && chance(0.6) ? 'pine' : 'oak', variant: randInt(0, 1), wood: 3, stump: false, regrowAt: 0, reservedBy: 0 };
    world.trees.push(tree);
    const k = Math.floor(x / TB) + Math.floor(y / TB) * tcols;
    if (!treeBuckets.has(k)) treeBuckets.set(k, []);
    treeBuckets.get(k).push(tree);
    markSolid(world, x - 2, y - 2, x + 2, y);
  }

  // Berry bushes in a few meadow patches.
  for (let p = 0; p < 3; p++) {
    let px = 0, py = 0, found = false;
    for (let i = 0; i < 300 && !found; i++) {
      const ang = rand() * Math.PI * 2, r = randRange(170, 380);
      px = cx + Math.cos(ang) * r * 1.2; py = cy + Math.sin(ang) * r * 0.8;
      found = !isBlocked(world, px, py) && sampleField(world.forestF, px, py) < 0.45
        && !world.noBuild.some(rc => px > rc.x0 - 30 && px < rc.x1 + 30 && py > rc.y0 - 30 && py < rc.y1 + 30);
    }
    if (!found) continue;
    for (let k = 0; k < randInt(5, 8); k++) {
      const x = Math.round(px + randRange(-38, 38)), y = Math.round(py + randRange(-26, 26));
      if (isBlocked(world, x, y) || isBlocked(world, x, y + 6) || nearTree(x, y, 14)) continue;
      if (world.bushes.some(b => dist(b.x, b.y, x, y) < 15)) continue;
      if (world.noBuild.some(rc => x > rc.x0 && x < rc.x1 && y > rc.y0 && y < rc.y1 + 10)) continue;
      world.bushes.push({ id: world.nextId++, x, y, ix: x, iy: y + 6, berries: randInt(2, 6), max: 6, reservedBy: 0 });
    }
  }

  buildGraph(world);
  if (nearestVisibleNode(world, canteen.door.x, canteen.door.y) < 0) return null;

  // Keep only resources a Thrimp can actually walk to.
  for (const tr of world.trees) {
    tr.reachable = false;
    for (const s of chance(0.5) ? [-9, 9] : [9, -9]) {
      const ix = tr.x + s, iy = tr.y + 1;
      if (!isBlocked(world, ix, iy) && nearestVisibleNode(world, ix, iy) >= 0) { tr.ix = ix; tr.iy = iy; tr.reachable = true; break; }
    }
  }
  world.bushes = world.bushes.filter(b => nearestVisibleNode(world, b.ix, b.iy) >= 0);
  if (world.bushes.length < 6) return null;
  world.buildings = world.buildings.filter(b => b === canteen || nearestVisibleNode(world, b.door.x, b.door.y) >= 0);
  if (world.lumberyard && !world.buildings.includes(world.lumberyard)) world.lumberyard = null;

  for (let i = 0; i < 2500 && world.shoreSpots.length < 40; i++) {
    const x = Math.round(randRange(20, MAP_W - 20)), y = Math.round(randRange(20, MAP_H - 20));
    if (isBlocked(world, x, y) || sampleField(world.forestF, x, y) > 0.6) continue;
    let face = null;
    for (const [dx, dy, dir] of [[0, 12, 'south'], [0, -12, 'north'], [12, 0, 'east'], [-12, 0, 'west']]) {
      if (isWater(world, x + dx, y + dy)) { face = dir; break; }
    }
    if (face && nearestVisibleNode(world, x, y) >= 0) world.shoreSpots.push({ x, y, face });
  }

  const huts = world.buildings.filter(b => b.type === 'hut');
  for (let i = 0; i < CONFIG.START_THRIMPS; i++) {
    const home = huts[Math.floor(i / 2)] || null;
    const door = home ? home.door : canteen.door;
    world.thrimps.push(makeThrimp(world, door.x + randRange(-8, 8), door.y + randRange(2, 10), home ? home.id : 0));
  }
  return world;
}

// --- Path network: a sparse graph of walkable points, routed with A* ---
function buildGraph(world) {
  const BS = 64, cols = Math.ceil(MAP_W / BS);
  const g = { nodes: [], buckets: new Map(), BS, cols };
  world.graph = g;
  const spacing = CONFIG.NODE_SPACING;
  for (let a = 0; a < 9000; a++) {
    const x = Math.round(randRange(10, MAP_W - 10)), y = Math.round(randRange(14, MAP_H - 8));
    if (isBlocked(world, x, y)) continue;
    let ok = true;
    graphNear(g, x, y, spacing, n => {
      if ((n.x - x) ** 2 + (n.y - y) ** 2 < (spacing * 0.8) ** 2) { ok = false; return false; }
    });
    if (!ok) continue;
    const n = { i: g.nodes.length, x, y, edges: [], main: false };
    g.nodes.push(n);
    const k = Math.floor(x / BS) + Math.floor(y / BS) * cols;
    if (!g.buckets.has(k)) g.buckets.set(k, []);
    g.buckets.get(k).push(n);
  }
  const maxLen = spacing * 1.9;
  for (const a of g.nodes) {
    graphNear(g, a.x, a.y, maxLen, b => {
      if (b.i <= a.i) return;
      const d = dist(a.x, a.y, b.x, b.y);
      if (d > maxLen || !segmentClear(world, a.x, a.y, b.x, b.y)) return;
      a.edges.push({ to: b.i, cost: d });
      b.edges.push({ to: a.i, cost: d });
    });
  }
  // Only the network connected to the canteen counts; islands are ignored.
  const door = world.canteen.door;
  let start = null, best = Infinity;
  graphNear(g, door.x, door.y, 200, n => {
    const d = dist(n.x, n.y, door.x, door.y);
    if (d < best && segmentClear(world, door.x, door.y, n.x, n.y)) { best = d; start = n; }
  });
  if (!start) return;
  const queue = [start];
  start.main = true;
  while (queue.length) {
    const n = queue.pop();
    for (const e of n.edges) { const m = g.nodes[e.to]; if (!m.main) { m.main = true; queue.push(m); } }
  }
}
function graphNear(g, x, y, r, fn) {
  const bx = Math.floor(x / g.BS), by = Math.floor(y / g.BS), k = Math.ceil(r / g.BS);
  for (let j = by - k; j <= by + k; j++) for (let i = bx - k; i <= bx + k; i++) {
    if (i < 0 || j < 0 || i >= g.cols) continue;
    const list = g.buckets.get(i + j * g.cols);
    if (list) for (const n of list) if (fn(n) === false) return;
  }
}
function nearbyMainNodes(world, x, y, r) {
  const out = [];
  graphNear(world.graph, x, y, r, n => { if (n.main) out.push(n); });
  return out.sort((a, b) => ((a.x - x) ** 2 + (a.y - y) ** 2) - ((b.x - x) ** 2 + (b.y - y) ** 2));
}
function nearestVisibleNode(world, x, y) {
  const cands = nearbyMainNodes(world, x, y, 200);
  for (let i = 0; i < Math.min(cands.length, 12); i++) if (segmentClear(world, x, y, cands[i].x, cands[i].y)) return cands[i].i;
  return -1;
}
function astar(g, s, t) {
  if (s === t) return [s];
  const N = g.nodes.length, T = g.nodes[t];
  const gs = new Float64Array(N).fill(Infinity), from = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const h = i => dist(g.nodes[i].x, g.nodes[i].y, T.x, T.y);
  const open = new MinHeap();
  gs[s] = 0; open.push(s, h(s));
  while (open.size) {
    const u = open.pop();
    if (u === t) break;
    if (closed[u]) continue;
    closed[u] = 1;
    for (const e of g.nodes[u].edges) {
      const ng = gs[u] + e.cost;
      if (ng < gs[e.to]) { gs[e.to] = ng; from[e.to] = u; open.push(e.to, ng + h(e.to)); }
    }
  }
  if (from[t] < 0) return null;
  const path = [t];
  for (let c = t; c !== s;) { c = from[c]; path.push(c); }
  return path.reverse();
}
// Skip waypoints wherever a straight walk is clear, so routes look chosen rather than gridded.
function smoothRoute(world, pts) {
  const out = [pts[0]];
  let i = 0;
  while (i < pts.length - 1) {
    let j = Math.min(pts.length - 1, i + 6);
    while (j > i + 1 && !segmentClear(world, pts[i].x, pts[i].y, pts[j].x, pts[j].y)) j--;
    out.push(pts[j]);
    i = j;
  }
  return out;
}
function findRoute(world, x0, y0, x1, y1) {
  const d = dist(x0, y0, x1, y1);
  if (d < 1) return [];
  if (d < 220 && segmentClear(world, x0, y0, x1, y1)) return [{ x: x1, y: y1 }];
  let a = nearestVisibleNode(world, x0, y0);
  if (a < 0) { const near = nearbyMainNodes(world, x0, y0, 400); if (!near.length) return null; a = near[0].i; }
  const b = nearestVisibleNode(world, x1, y1);
  if (b < 0) return null;
  const path = astar(world.graph, a, b);
  if (!path) return null;
  const pts = [{ x: x0, y: y0 }, ...path.map(i => ({ x: world.graph.nodes[i].x, y: world.graph.nodes[i].y })), { x: x1, y: y1 }];
  return smoothRoute(world, pts).slice(1);
}

// ============================================================
// THRIMP: needs, schedule, memory of recent activity
// ============================================================
function makeThrimp(world, x, y, homeId) {
  return {
    id: world.nextId++, name: makeName(world.names),
    x, y, px: x, py: y,
    dir: 'south', moving: false, working: false, hidden: false, asleep: false, stepPhase: 0,
    speed: CONFIG.WALK_SPEED * randRange(0.85, 1.15),
    needs: { food: randRange(0.6, 0.9), rest: randRange(0.7, 0.95), fun: randRange(0.4, 0.9) },
    schedule: { wake: randRange(5, 7.5), bed: randRange(21, 23.5) },
    likes: { forage: randRange(0.75, 1.25), chop: randRange(0.75, 1.25) },
    home: homeId,
    job: null, route: null, carrying: null,
    idleUntil: 0, nextCheck: 0, emote: null,
    recent: [],
  };
}
const isSleepTime = (th, h) => h >= th.schedule.bed || h < th.schedule.wake;
const isWorkTime = (th, h) => h >= th.schedule.wake + 1 && h < 18;
const isMealTime = h => (h >= 7 && h < 8.5) || (h >= 12 && h < 13.5) || (h >= 18 && h < 19.5);
const WORK_JOBS = new Set(['forage', 'chop', 'haul']);

function updateNeeds(th, dt) {
  const n = th.needs;
  n.food -= dt / (th.asleep ? 2200 : 1100);
  if (!th.asleep) n.rest -= dt / 1300 * (th.job && WORK_JOBS.has(th.job.type) ? 1.15 : 1);
  if (!th.asleep) n.fun -= dt / 1500;
  n.food = clamp(n.food, 0, 1); n.rest = clamp(n.rest, 0, 1); n.fun = clamp(n.fun, 0, 1);
}
function remember(th, world, text) {
  const last = th.recent[0];
  if (last && last.text === text && world.time - last.time < 3 * HOUR) { last.time = world.time; return; }
  th.recent.unshift({ time: world.time, text });
  if (th.recent.length > 8) th.recent.pop();
}
function emote(th, world, icon, mins = 20) { th.emote = { icon, until: world.time + mins }; }

// ============================================================
// AI: utility scoring picks a job; a job is a list of steps
// ============================================================
function goTo(x, y, label) {
  x = Math.round(x); y = Math.round(y);
  return {
    label,
    start(th, w) { const r = findRoute(w, th.x, th.y, x, y); if (!r) return 'fail'; th.route = r; },
    update(th) { return followRoute(th); },
    end(th) { th.route = null; th.moving = false; },
  };
}
function act(mins, label, o = {}) {
  let left = mins;
  return {
    label,
    start(th, w) { left = mins; return o.begin ? o.begin(th, w) : undefined; },
    update(th, w, dt) {
      left -= dt;
      const r = o.each ? o.each(th, w, dt) : undefined;
      if (r === 'fail') return 'fail';
      if (r === 'done' || left <= 0) { if (o.finish) o.finish(th, w); return true; }
      return false;
    },
    end(th, w) { if (o.end) o.end(th, w); },
  };
}
const job = (title, steps, extra = {}) => ({ title, steps, i: 0, started: false, ...extra });

function followRoute(th) {
  const r = th.route;
  if (!r || !r.length) { th.moving = false; return true; }
  let budget = th.speed * CONFIG.MIN_PER_TICK;
  if (th.needs.rest < 0.2) budget *= 0.8;
  if (th.needs.food < 0.1) budget *= 0.85;
  const start = budget;
  while (budget > 0 && r.length) {
    const p = r[0], dx = p.x - th.x, dy = p.y - th.y, d = Math.hypot(dx, dy);
    if (d > 0.01) th.dir = dirFromVec(dx, dy);
    if (d <= budget) { th.x = p.x; th.y = p.y; budget -= d; r.shift(); }
    else { th.x += dx / d * budget; th.y += dy / d * budget; budget = 0; }
  }
  th.stepPhase += start - budget;
  th.moving = r.length > 0;
  return r.length === 0;
}
function dirFromVec(dx, dy) { return DIRS[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8]; }

const eat = (th, amount) => { th.needs.food = Math.min(1, th.needs.food + amount); };
function deposit(world, th) {
  if (!th.carrying) return;
  world.stock[th.carrying.kind === 'food' ? 'food' : 'wood'] += th.carrying.amount;
  th.carrying = null;
}
function claimSeat(world, th) {
  const free = world.seats.filter(s => !s.takenBy);
  if (!free.length) return null;
  const seat = pick(free);
  seat.takenBy = th.id;
  return seat;
}
function releaseSeat(world, th) { for (const s of world.seats) if (s.takenBy === th.id) s.takenBy = 0; }
function findBush(world, th, minBerries) {
  let best = null, bestScore = 0;
  for (const b of world.bushes) {
    if (b.berries < minBerries || (b.reservedBy && b.reservedBy !== th.id)) continue;
    const s = b.berries / (dist(th.x, th.y, b.x, b.y) + 120);
    if (s > bestScore) { bestScore = s; best = b; }
  }
  return best;
}
const releaseIfMine = (thing, th) => { if (thing && thing.reservedBy === th.id) thing.reservedBy = 0; };

function makeEatJob(th, w) {
  if (th.carrying && th.carrying.kind === 'food') {
    return job('Snacking on berries', [act(12, 'Eating berries', {
      finish: t => {
        const n = Math.min(2, t.carrying.amount);
        eat(t, 0.25 * n);
        t.carrying.amount -= n;
        if (t.carrying.amount <= 0) t.carrying = null;
      },
    })]);
  }
  if (w.stock.food >= 1) {
    const seat = claimSeat(w, th);
    const spot = seat || { x: w.canteen.door.x + randRange(-30, 30), y: w.canteen.door.y + randRange(30, 42) };
    return job('Going for a meal', [
      goTo(spot.x, spot.y, 'Walking to the canteen'),
      act(randRange(20, 30), 'Eating at the canteen', {
        begin: t => { if (w.stock.food < 1) return 'fail'; w.stock.food -= 1; t.dir = seat ? seat.face : 'north'; },
        finish: t => eat(t, 0.65),
      }),
    ], { cleanup: t => releaseSeat(w, t) });
  }
  const bush = findBush(w, th, 1);
  if (!bush) return null;
  bush.reservedBy = th.id;
  return job('Looking for something to eat', [
    goTo(bush.ix, bush.iy, 'Walking to a berry bush'),
    act(15, 'Eating wild berries', {
      begin: t => { if (bush.berries < 1) return 'fail'; t.dir = 'north'; },
      finish: t => { const n = Math.min(2, Math.floor(bush.berries)); bush.berries -= n; eat(t, 0.2 * n); },
    }),
  ], { cleanup: t => releaseIfMine(bush, t) });
}

function makeSleepJob(th, w) {
  const home = w.byId.get(th.home);
  if (!home) {
    // Homeless: curl up near the canteen.
    const n = pick(nearbyMainNodes(w, w.canteen.x, w.canteen.y, 160));
    if (!n) return null;
    return job('Sleeping rough', [goTo(n.x, n.y, 'Looking for a place to lie down'), sleepStep(w, null)]);
  }
  return job('Going to bed', [goTo(home.door.x + randRange(-3, 3), home.door.y, 'Walking home'), sleepStep(w, home)]);
}
function sleepStep(w, home) {
  return {
    label: home ? 'Sleeping at home' : 'Sleeping on the ground',
    start(t) { t.asleep = true; if (home) { t.hidden = true; home.sleepers.push(t.id); } },
    update(t, w2, dt) {
      t.needs.rest = Math.min(1, t.needs.rest + dt / 360);
      if (t.needs.food < 0.15) return true;
      return t.needs.rest >= 1 && !isSleepTime(t, hourOf(w.time));
    },
    end(t) {
      t.asleep = false;
      if (home) {
        t.hidden = false;
        home.sleepers = home.sleepers.filter(id => id !== t.id);
        t.x = t.px = home.door.x + randRange(-4, 4);
        t.y = t.py = home.door.y + 2;
        t.dir = 'south';
      }
    },
  };
}

function makeForageJob(th, w) {
  const bush = findBush(w, th, 2);
  if (!bush) return null;
  bush.reservedBy = th.id;
  let timer = 0;
  return job('Foraging berries', [
    goTo(bush.ix, bush.iy, 'Walking to a berry bush'),
    act(40, 'Picking berries', {
      begin: t => { t.working = true; t.dir = 'north'; },
      each: (t, w2, dt) => {
        timer += dt;
        while (timer >= 6 && bush.berries >= 1) {
          timer -= 6;
          bush.berries -= 1;
          if (!t.carrying) t.carrying = { kind: 'food', amount: 0 };
          t.carrying.amount++;
        }
        const have = t.carrying ? t.carrying.amount : 0;
        if (have >= 5) return 'done';
        if (bush.berries < 1) return have > 0 ? 'done' : 'fail';
      },
      end: t => { t.working = false; releaseIfMine(bush, t); },
    }),
    goTo(w.store.x + randRange(-5, 5), w.store.y + randRange(-1, 3), 'Carrying berries to the canteen'),
    act(3, 'Storing berries', { finish: t => deposit(w, t) }),
  ], { cleanup: t => releaseIfMine(bush, t) });
}

function makeChopJob(th, w) {
  const yard = w.lumberyard;
  if (!yard) return null;
  let tree = null, best = Infinity;
  for (const tr of w.trees) {
    if (tr.stump || !tr.reachable || (tr.reservedBy && tr.reservedBy !== th.id)) continue;
    const s = dist(tr.x, tr.y, yard.x, yard.y) + 0.5 * dist(tr.x, tr.y, th.x, th.y);
    if (s < best) { best = s; tree = tr; }
  }
  if (!tree) return null;
  tree.reservedBy = th.id;
  return job('Chopping wood', [
    goTo(tree.ix, tree.iy, 'Walking to a tree'),
    act(45, 'Chopping a tree', {
      begin: t => { if (tree.stump) return 'fail'; t.working = true; t.dir = tree.ix < tree.x ? 'east' : 'west'; },
      finish: t => {
        tree.wood--;
        if (tree.wood <= 0) { tree.stump = true; tree.regrowAt = w.time + 4 * DAY; }
        t.carrying = { kind: 'wood', amount: 2 };
      },
      end: t => { t.working = false; releaseIfMine(tree, t); },
    }),
    goTo(yard.drop.x + randRange(-8, 8), yard.drop.y + randRange(-1, 3), 'Hauling logs to the lumberyard'),
    act(3, 'Stacking logs', { finish: t => deposit(w, t) }),
  ], { cleanup: t => releaseIfMine(tree, t) });
}

function makeHaulJob(th, w) {
  if (!th.carrying) return null;
  const food = th.carrying.kind === 'food';
  if (!food && !w.lumberyard) return null;
  const to = food ? w.store : w.lumberyard.drop;
  return job(food ? 'Bringing berries to the canteen' : 'Bringing logs to the lumberyard', [
    goTo(to.x + randRange(-5, 5), to.y + randRange(-1, 3), food ? 'Carrying berries' : 'Carrying logs'),
    act(3, 'Putting things away', { finish: t => deposit(w, t) }),
  ]);
}

function makeRelaxJob(th, w) {
  const options = [];
  if (w.shoreSpots.length) options.push({ weight: 2, where: 'by the water', spot: pick(w.shoreSpots) });
  if (w.seats.some(s => !s.takenBy)) options.push({ weight: 1.5, where: 'at the canteen', seat: true });
  const n = pick(nearbyMainNodes(w, th.x, th.y, 260));
  if (n) options.push({ weight: 1, where: 'in the grass', spot: { x: n.x + randRange(-10, 10), y: n.y + randRange(-10, 10), face: pick(DIRS) } });
  const o = weightedPick(options, o => o.weight);
  if (!o) return null;
  const spot = o.seat ? claimSeat(w, th) : o.spot;
  return job('Taking it easy', [
    goTo(spot.x, spot.y, `Strolling to a spot ${o.where}`),
    act(randRange(30, 70), `Relaxing ${o.where}`, {
      begin: t => { t.dir = spot.face || t.dir; },
      each: (t, w2, dt) => { t.needs.fun = Math.min(1, t.needs.fun + dt / 60); if (t.needs.fun >= 1) return 'done'; },
    }),
  ], { cleanup: t => releaseSeat(w, t) });
}

function makeWanderJob(th, w) {
  const n = pick(nearbyMainNodes(w, th.x, th.y, 160));
  if (!n) return null;
  return job('Wandering', [
    goTo(n.x + randRange(-12, 12), n.y + randRange(-12, 12), 'Wandering about'),
    act(randRange(5, 20), 'Looking around'),
  ]);
}

// Utility AI: every option scores itself; the best (with a little noise) wins.
const ACTIONS = [
  { id: 'eat', make: makeEatJob, score(th, w) {
    const f = th.needs.food;
    let s = f < 0.3 ? 1.25 - f : f < 0.6 ? 0.62 - f * 0.6 : 0;
    if (f < 0.8 && isMealTime(hourOf(w.time))) s += 0.3;
    return s;
  } },
  { id: 'sleep', make: makeSleepJob, score(th, w) {
    const r = th.needs.rest;
    if (isSleepTime(th, hourOf(w.time))) return 0.95 + (1 - r) * 0.3;
    return r < 0.2 ? 1.15 - r : 0;
  } },
  { id: 'haul', make: makeHaulJob, score: th => th.carrying ? 0.85 : 0 },
  { id: 'forage', make: makeForageJob, score(th, w) {
    if (!isWorkTime(th, hourOf(w.time))) return 0;
    const need = clamp(1 - w.stock.food / (w.thrimps.length * 4), 0, 1);
    return (0.32 + 0.5 * need) * th.likes.forage;
  } },
  { id: 'chop', make: makeChopJob, score(th, w) {
    if (!isWorkTime(th, hourOf(w.time))) return 0;
    const need = clamp(1 - w.stock.wood / 40, 0, 1); // wood has no use yet, so keep the stockpile modest
    return (0.18 + 0.35 * need) * th.likes.chop;
  } },
  { id: 'relax', make: makeRelaxJob, score(th, w) {
    const s = (1 - th.needs.fun) * 0.75;
    return isWorkTime(th, hourOf(w.time)) ? s * 0.7 : s + 0.3;
  } },
  { id: 'wander', make: makeWanderJob, score: () => 0.12 },
];

function chooseJob(th, w) {
  const scored = [];
  for (const a of ACTIONS) {
    const s = a.score(th, w);
    if (s > 0) scored.push({ a, s: s + rand() * 0.06 });
  }
  scored.sort((p, q) => q.s - p.s);
  while (scored.length) {
    const top = scored.slice(0, 2).filter(o => o.s > scored[0].s - 0.08);
    const o = weightedPick(top, o => o.s);
    const j = o.a.make(th, w);
    if (j) { startJob(th, w, j, o.a.id); return; }
    scored.splice(scored.indexOf(o), 1);
  }
}
function startJob(th, w, j, type) {
  j.type = type;
  th.job = j;
  remember(th, w, j.title);
}
function runJob(th, w, dt) {
  const j = th.job, step = j.steps[j.i];
  if (!j.started) {
    j.started = true;
    if (step.start && step.start(th, w) === 'fail') return finishJob(th, w, false);
  }
  const r = step.update(th, w, dt);
  if (r === 'fail') return finishJob(th, w, false);
  if (r === true) {
    if (step.end) step.end(th, w);
    j.started = false;
    j.i++;
    if (j.i >= j.steps.length) finishJob(th, w, true);
  }
}
function finishJob(th, w, ok) {
  const j = th.job;
  if (!j) return;
  if (j.started) { const step = j.steps[j.i]; if (step && step.end) step.end(th, w); }
  if (j.cleanup) j.cleanup(th, w);
  th.job = null; th.route = null; th.moving = false; th.working = false;
  if (!ok) th.idleUntil = w.time + 3;
}
// Needs can cut a job short: hungry mid-shift means a detour to eat.
function checkInterrupts(th, w) {
  const type = th.job.type;
  if (type === 'eat' || type === 'sleep' || w.time < th.nextCheck) return;
  th.nextCheck = w.time + 10;
  let next = null, nextType = '', why = '';
  if (th.needs.food < 0.12) { next = makeEatJob(th, w); nextType = 'eat'; why = 'Too hungry to keep going'; }
  else if (th.needs.rest < 0.05) { next = makeSleepJob(th, w); nextType = 'sleep'; why = 'Too exhausted to keep going'; }
  if (!next) return;
  finishJob(th, w, true);
  remember(th, w, why);
  emote(th, w, '!');
  startJob(th, w, next, nextType);
}

function updateThrimp(th, w, dt) {
  updateNeeds(th, dt);
  if (th.emote && th.emote.until < w.time) th.emote = null;
  if (th.job) checkInterrupts(th, w);
  if (!th.job) {
    if (th.idleUntil > w.time) return;
    chooseJob(th, w);
    if (!th.job) { th.idleUntil = w.time + 5; return; }
  }
  runJob(th, w, dt);
}

function tick(w) {
  const dt = CONFIG.MIN_PER_TICK;
  w.time += dt;
  w.tick++;
  for (const b of w.bushes) if (b.berries < b.max) b.berries = Math.min(b.max, b.berries + dt / 240);
  if (w.tick % 50 === 0) for (const tr of w.trees) if (tr.stump && w.time >= tr.regrowAt) { tr.stump = false; tr.wood = 3; }
  for (const th of w.thrimps) updateThrimp(th, w, dt);
}

// PixelLab character animations, cut from sheets into one sprite per frame: thrimpAnims.walk.east[3].
const thrimpAnims = {};
function opaqueRows(c) {
  try {
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let top = -1, bottom = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 0) { if (top < 0) top = y; bottom = y; }
    }
    return bottom >= 0 ? { top, bottom } : null;
  } catch (e) { return null; } // opened from file:// the canvas is tainted; fall back to the frame box
}
function loadThrimpSheet(name, src) {
  const img = new Image();
  img.onload = () => {
    const size = img.height / SHEET_DIRS.length, cols = Math.round(img.width / size), anim = {};
    SHEET_DIRS.forEach((dir, row) => {
      const frames = [];
      for (let col = 0; col < cols; col++) {
        const c = makeCanvas(size, size);
        c.getContext('2d').drawImage(img, col * size, row * size, size, size, 0, 0, size, size);
        frames.push({ c, rows: opaqueRows(c) });
      }
      // One baseline per direction (the lowest foot in any frame) so feet stay planted while walking.
      const bottom = Math.max(...frames.map(f => f.rows ? f.rows.bottom : size - 1));
      const top = Math.min(...frames.map(f => f.rows ? f.rows.top : 0));
      anim[dir] = frames.map(f => sprite(f.c, Math.floor(size / 2), bottom, { top }));

function thrimpSprite(th) {
  const walk = th.moving && thrimpAnims.walk && thrimpAnims.walk[th.dir];
  if (walk) return walk[Math.floor(th.stepPhase / CONFIG.WALK_PX_PER_FRAME) % walk.length];
  const idle = thrimpAnims.idle && thrimpAnims.idle[th.dir];
  if (idle) return idle[Math.floor(world.time / CONFIG.IDLE_MIN_PER_FRAME + th.id * 1.7) % idle.length]; // offset per Thrimp so they don't breathe in unison
  return th.dir.startsWith('north') ? sprites.placeholder.back : sprites.placeholder.front;

// GROUND: painted once into one big pixel canvas (no tiles)
// ============================================================
function paintGround(world, P) {
  const c = makeCanvas(MAP_W, MAP_H), g = c.getContext('2d');
  const img = g.createImageData(MAP_W, MAP_H), d = img.data;
  const grass = P.grass.map(hexRgb), dirt = P.dirt.map(hexRgb), water = P.water.map(hexRgb);
  const T = world.waterT;
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const b = bayer(x, y) - 0.5;
      const wv = sampleField(world.waterF, x, y);
      let col;
      if (wv > T) {
        const depth = (wv - T) / 0.06;
        col = depth < 0.12 ? (b > 0.25 ? water[2] : water[1]) : depth + b * 0.35 > 1 ? water[0] : water[1];
      } else if (wv > T - 0.014 + b * 0.006) {
        col = wv > T - 0.006 ? dirt[1] : dirt[2];
      } else {
        const tint = sampleField(world.tintF, x, y) + b * 0.08;
        const fo = sampleField(world.forestF, x, y) + b * 0.12;
        col = fo > 0.72 ? grass[0] : (fo > 0.45 || tint < 0.36) ? grass[1] : grass[2];
      }
      const i = (y * MAP_W + x) * 4;
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
    }
  }
  // Worn ground at doors, under the tables and around the lumberyard (trails will add to this later).
  for (const s of world.dirtSpots) {
    for (let y = Math.floor(s.y - s.ry); y <= s.y + s.ry; y++) for (let x = Math.floor(s.x - s.rx); x <= s.x + s.rx; x++) {
      if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H || isWater(world, x, y)) continue;
      const v = 1 - (((x - s.x) / s.rx) ** 2 + ((y - s.y) / s.ry) ** 2) + (bayer(x, y) - 0.5) * 0.5;
      if (v <= 0) continue;
      const col = v > 0.7 && bayer(x + 1, y + 2) > 0.85 ? dirt[3] : dirt[2];
      const i = (y * MAP_W + x) * 4;
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2];
    }
  }
  g.putImageData(img, 0, 0);

  // Decoration uses its own rng seeded from the world, so repainting (e.g. after loading a save) gives the same meadow.
  const r = mulberry32(world.seed ^ 0x5eed);
  const at = () => [Math.floor(r() * MAP_W), Math.floor(r() * MAP_H)];
  const meadow = (x, y) => sampleField(world.waterF, x, y) < T - 0.02 && dirtValue(world, x, y) <= 0;
  for (let i = 0; i < MAP_W * MAP_H / 240; i++) {
    const [x, y] = at();
    if (!meadow(x, y)) continue;
    const fo = sampleField(world.forestF, x, y);
    g.fillStyle = fo > 0.6 ? P.grass[0] : r() < 0.5 ? P.grass[3] : P.grass[1];
    g.fillRect(x - 1, y - 1, 1, 2); g.fillRect(x, y - 2, 1, 3); g.fillRect(x + 1, y - 1, 1, 2);
  }
  for (let k = 0; k < 50; k++) {
    const [cx, cy] = at();
    if (!meadow(cx, cy) || sampleField(world.forestF, cx, cy) > 0.4) continue;
    const col = P.flower[Math.floor(r() * P.flower.length)];
    for (let i = 0; i < 4 + r() * 6; i++) {
      const x = Math.round(cx + (r() - 0.5) * 24), y = Math.round(cy + (r() - 0.5) * 16);
      if (!meadow(x, y)) continue;
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
      g.fillStyle = P.grass[1]; g.fillRect(x, y + 1, 1, 1);
    }
  }
  for (let i = 0; i < 180; i++) {
    const [x, y] = at();
    if (!meadow(x, y)) continue;
    g.fillStyle = P.stone[0]; g.fillRect(x, y, 2, 1);
    g.fillStyle = P.stone[2]; g.fillRect(x, y - 1, 1, 1);
  }
  for (let i = 0; i < 6000; i++) {
    const [x, y] = at();
    const wv = sampleField(world.waterF, x, y);
    if (wv < T - 0.016 || wv > T + 0.004) continue;
    g.fillStyle = P.grass[1]; g.fillRect(x, y - 3, 1, 3);
    if (r() < 0.3) { g.fillStyle = P.dirt[1]; g.fillRect(x, y - 4, 1, 1); }
  }
  for (let i = 0; i < 3000; i++) {
    const [x, y] = at();
    if (sampleField(world.waterF, x, y) < T + 0.02) continue;
    g.fillStyle = P.grass[2]; g.fillRect(x, y, 3, 1); g.fillRect(x + 1, y + 1, 2, 1);
  }
  return c;
}

  for (let a = 0; a < 28; a++) {
    const t = a / 28 * Math.PI * 2;
    ctx.fillRect(Math.round(x + Math.cos(t) * rx), Math.round(y + Math.sin(t) * ry), 1, 1);
  }
}
const blit = (s, x, y) => ctx.drawImage(s.img, Math.round(x) - s.ax, Math.round(y) - s.ay);
const thrimpPos = (th, alpha) => ({ x: Math.round(lerp(th.px, th.x, alpha)), y: Math.round(lerp(th.py, th.y, alpha)) });

function drawThrimp(th, alpha) {
  const { x, y } = thrimpPos(th, alpha);
  const s = thrimpSprite(th), height = s.ay - (s.top || 0);
  const bob = th.moving && !thrimpAnims.walk ? (Math.floor(th.stepPhase / 5) & 1) : 0; // placeholder bounce until the walk sheet loads
  const shake = th.working ? ((Math.floor(world.time * 3) & 1) ? 1 : -1) : 0;
  ctx.drawImage(s.img, x - s.ax + shake, y - s.ay - bob);
  if (th.carrying) {
    if (th.carrying.kind === 'food') {
      const hx = x + (th.dir.includes('west') ? -6 : 3), hy = y - Math.round(height * 0.38) - bob;
      ctx.fillStyle = P.berry[0]; ctx.fillRect(hx, hy, 3, 2);
      ctx.fillStyle = P.berry[1]; ctx.fillRect(hx, hy, 1, 1); ctx.fillRect(hx + 2, hy, 1, 1);
    } else {
      blit(sprites.log, x, y - Math.round(height * 0.62) - bob);
    }
  }
}
function emoteFor(th) {
  if (th.emote) return th.emote.icon;
  if (th.needs.food < 0.12) return 'hungry';
  if (th.needs.rest < 0.1 && !th.asleep) return 'z';
  if (th.asleep && !th.hidden) return 'z';
  return null;
}

function render(alpha) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = P.outline;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const z = cam.zoom * dpr;
  const tx = Math.round(canvas.width / 2 - cam.x * z), ty = Math.round(canvas.height / 2 - cam.y * z);
  ctx.setTransform(z, 0, 0, z, tx, ty);
  ctx.drawImage(world.ground, 0, 0);

  const hw = viewW / 2 / cam.zoom, hh = viewH / 2 / cam.zoom;
  const vx0 = cam.x - hw - 48, vx1 = cam.x + hw + 48, vy0 = cam.y - hh - 16, vy1 = cam.y + hh + 64;
  const inView = (x, y) => x > vx0 && x < vx1 && y > vy0 && y < vy1;
  const list = [];

  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  for (const tr of world.trees) {
    if (!inView(tr.x, tr.y)) continue;
    if (tr.stump) { list.push({ y: tr.y, draw: () => blit(sprites.stump, tr.x, tr.y) }); continue; }
    shadow(tr.x, tr.y, 8, 2);
    const s = sprites[tr.kind][tr.variant];
    list.push({ y: tr.y, draw: () => blit(s, tr.x, tr.y) });
  }
  for (const b of world.bushes) {
    if (!inView(b.x, b.y)) continue;
    list.push({ y: b.y, draw: () => {
      const s = sprites.bush;
      blit(s, b.x, b.y);
      const n = Math.floor(b.berries), ox = b.x - s.ax, oy = b.y - s.ay;
      for (let i = 0; i < n && i < s.berrySpots.length; i++) {
        const [bx, by] = s.berrySpots[i];
        ctx.fillStyle = P.berry[0]; ctx.fillRect(ox + bx, oy + by, 2, 2);
        ctx.fillStyle = P.berry[1]; ctx.fillRect(ox + bx, oy + by, 1, 1);
      }
    } });
  }
  for (const b of world.buildings) {
    if (!inView(b.x, b.y)) continue;
    if (b.type === 'lumberyard') {
      list.push({ y: b.y, draw: () => {
        const logs = Math.min(30, Math.ceil(world.stock.wood / 2));
        for (let i = 0; i < logs; i++) {
          const pile = Math.floor(i / 10), k = i % 10, row = k < 4 ? 0 : k < 7 ? 1 : k < 9 ? 2 : 3;
          const inRow = [0, 4, 7, 9][row], col = k - inRow, rowLen = 4 - row;
          blit(sprites.log, b.x - 16 + pile * 14 + (col - (rowLen - 1) / 2) * 4 + 6, b.y - 2 - row * 4 - pile);
        }
        blit(sprites.block, b.x + 16, b.y + 2);
      } });
    } else {
      const s = sprites[b.type];
      list.push({ y: b.y, draw: () => blit(s, b.x, b.y) });
    }
  }
  for (const t of world.tables) if (inView(t.x, t.y)) list.push({ y: t.y, draw: () => blit(sprites.table, t.x, t.y) });
  if (inView(world.crate.x, world.crate.y)) {
    list.push({ y: world.crate.y, draw: () => {
      const s = sprites.crate, ox = world.crate.x - s.ax, oy = world.crate.y - s.ay;
      blit(s, world.crate.x, world.crate.y);
      const n = Math.min(10, Math.ceil(world.stock.food / 3));
      for (let i = 0; i < n; i++) {
        ctx.fillStyle = i % 2 ? P.berry[0] : P.berry[1];
        ctx.fillRect(ox + 3 + (i % 5) * 2, oy + 1 - Math.floor(i / 5), 2, 1);
      }
    } });
  }
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  for (const th of world.thrimps) {
    if (th.hidden) continue;
    const p = thrimpPos(th, alpha);
    if (!inView(p.x, p.y)) continue;
    shadow(p.x, p.y, 5, 1);
    list.push({ y: p.y + 0.5, draw: () => {
      if (th.id === game.selected) ring(p.x, p.y, 8, 3, P.light[1]);
      else if (th.id === game.hovered) ring(p.x, p.y, 8, 3, P.white);
      drawThrimp(th, alpha);
    } });
  }
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.draw();

  // Emotes float above heads; a "z" hangs over any hut with sleepers.
  for (const th of world.thrimps) {
    const icon = !th.hidden && emoteFor(th);
    if (!icon) continue;
    const p = thrimpPos(th, alpha), s = thrimpSprite(th);
    blit(sprites.emotes[icon], p.x, p.y - (s.ay - (s.top || 0)) - 3);
  }
  for (const b of world.buildings) {
    if (b.sleepers.length && inView(b.x, b.y)) blit(sprites.emotes.z, b.x + 10, b.y - sprites[b.type].ay - 2 + Math.round(Math.sin(world.time / 6) * 1.5));
  }

  drawNight(z, tx, ty);
  if (game.debug) drawDebug();
  drawLabels(alpha);
}

function drawNight(z, tx, ty) {
  const h = hourOf(world.time), dk = darkness(h);
  if (dk <= 0) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = dk * 0.6;
  ctx.fillStyle = P.night;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1;
  ctx.setTransform(z, 0, 0, z, tx, ty);
  const lights = [];
  for (const b of world.buildings) {
    const s = sprites[b.type];
    if (!s || !s.windows) continue;
    const lit = b.type === 'canteen' || (b.sleepers.length > 0 && (h >= 17 || h < 0.5) && h < 23.5);
    if (!lit) continue;
    for (const w of s.windows) lights.push({ x: b.x + w.x, y: b.y + w.y, w: w.w, h: w.h });
  }
  for (const L of lights) {
    const cx = L.x + L.w / 2, cy = L.y + L.h / 2;
    const grad = ctx.createRadialGradient(cx, cy, 1, cx, cy, 18);
    grad.addColorStop(0, P.light[1]);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.28 * dk;
    ctx.fillStyle = grad;
    ctx.fillRect(cx - 18, cy - 18, 36, 36);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = dk;
    ctx.fillStyle = P.light[2];
    ctx.fillRect(L.x, L.y, L.w, L.h);
    ctx.globalAlpha = 1;
  }
}

function drawDebug() {
  const g = world.graph;
  ctx.fillStyle = 'rgba(228,59,68,0.28)';
  for (let cy = 0; cy < world.gh; cy++) for (let cx = 0; cx < world.gw; cx++)
    if (world.solid[cy * world.gw + cx]) ctx.fillRect(cx * CONFIG.CELL, cy * CONFIG.CELL, CONFIG.CELL, CONFIG.CELL);
  ctx.lineWidth = 1 / cam.zoom;
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  for (const n of g.nodes) for (const e of n.edges) if (e.to > n.i) { ctx.moveTo(n.x, n.y); ctx.lineTo(g.nodes[e.to].x, g.nodes[e.to].y); }
  ctx.stroke();
  for (const n of g.nodes) { ctx.fillStyle = n.main ? '#ffffff' : '#e43b44'; ctx.fillRect(n.x - 1, n.y - 1, 2, 2); }
  const th = world.thrimps.find(t => t.id === game.selected);
  if (th && th.route && th.route.length) {
    ctx.strokeStyle = P.light[1];
    ctx.beginPath(); ctx.moveTo(th.x, th.y);
    for (const p of th.route) ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}

function drawLabels(alpha) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = 'bold 11px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.lineWidth = 3;
  ctx.strokeStyle = P.outline;
  for (const id of new Set([game.selected, game.hovered])) {
    const th = id && world.thrimps.find(t => t.id === id);
    if (!th || th.hidden) continue;
    const p = thrimpPos(th, alpha);
    const sp = worldToScreen(p.x, p.y + 4);
    ctx.fillStyle = id === game.selected ? P.light[1] : P.white;
    ctx.strokeText(th.name, sp.x, sp.y + 10);
    ctx.fillText(th.name, sp.x, sp.y + 10);
  }
}

// ============================================================
// UI: HUD, speed control, inspector
// ============================================================
const $ = id => document.getElementById(id);
function setSpeed(i) {
  if (i > 0) game.lastSpeed = i;
  game.speedIndex = i;
  updateUI();
}
function select(id) {
  game.selected = id;
  if (!id) cam.follow = false;
  updateUI();
}
function barColor(v) { return v > 0.5 ? 'var(--good)' : v > 0.25 ? 'var(--warn)' : 'var(--bad)'; }
function updateUI() {
  const h = hourOf(world.time);
  $('hud-place').textContent = world.placeName;
  $('hud-clock').textContent = `Day ${dayOf(world.time)} · ${fmtClock(world.time)} · ${periodName(h)}`;
  $('hud-pop').textContent = `${world.thrimps.length} Thrimps`;
  $('hud-food').textContent = `Food ${Math.floor(world.stock.food)}`;
  $('hud-wood').textContent = `Wood ${world.stock.wood}`;
  document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', +b.dataset.speed === game.speedIndex));

  const th = world.thrimps.find(t => t.id === game.selected);
  $('inspector').style.display = th ? 'block' : 'none';
  if (!th) return;
  const home = world.byId.get(th.home);
  const step = th.job && th.job.steps[th.job.i];
  $('i-name').textContent = th.name;
  $('i-home').textContent = `${home ? 'Lives in ' + home.label : 'Homeless'} · up ${fmtClock(th.schedule.wake * HOUR)} · bed ${fmtClock(th.schedule.bed * HOUR)}`;
  $('i-doing').textContent = step ? step.label : 'Thinking about what to do';
  $('i-why').textContent = th.job ? th.job.title : '';
  for (const k of ['food', 'rest', 'fun']) {
    const v = th.needs[k], el = $('i-' + k);
    el.style.width = Math.round(v * 100) + '%';
    el.style.background = barColor(v);
  }
  $('i-carry').textContent = th.carrying ? `Carrying ${th.carrying.amount} ${th.carrying.kind === 'food' ? 'berries' : 'logs'}` : '';
  const likes = Object.entries(th.likes).filter(([, v]) => v > 1.1).map(([k]) => k === 'forage' ? 'foraging' : 'chopping wood');
  $('i-likes').textContent = likes.length ? `Enjoys ${likes.join(' and ')}` : '';
  const ul = $('i-recent');
  ul.replaceChildren(...th.recent.map(r => {
    const li = document.createElement('li');
    const b = document.createElement('b');
    b.textContent = r.text;
    li.append(`${dayOf(r.time) !== dayOf(world.time) ? 'Day ' + dayOf(r.time) + ' ' : ''}${fmtClock(r.time)} `, b);
    return li;
  }));
  $('i-follow').classList.toggle('on', cam.follow);
}

function thrimpAt(wx, wy) {
  let best = null;
  for (const th of world.thrimps) {
    if (th.hidden) continue;
    const s = thrimpSprite(th), top = th.y - (s.ay - (s.top || 0));
    if (wx >= th.x - 8 && wx <= th.x + 8 && wy >= top - 2 && wy <= th.y + 3 && (!best || th.y > best.y)) best = th;
  }
  return best;
}

// ============================================================
// INPUT
// ============================================================
const keys = new Set();
let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  const w = screenToWorld(e.clientX, e.clientY);
  const th = thrimpAt(w.x, w.y);
  game.hovered = th ? th.id : 0;
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; cam.follow = false; canvas.classList.add('dragging'); }
  if (drag.moved) { cam.x = drag.cx - dx / cam.zoom; cam.y = drag.cy - dy / cam.zoom; }
});
canvas.addEventListener('pointerup', e => {
  if (drag && !drag.moved) {
    const w = screenToWorld(e.clientX, e.clientY);
    const th = thrimpAt(w.x, w.y);
    select(th ? th.id : 0);
  }
  drag = null;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('pointerleave', () => { game.hovered = 0; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zs = CONFIG.ZOOMS, i = zs.indexOf(cam.zoom);
  const next = zs[clamp(i + (e.deltaY < 0 ? 1 : -1), 0, zs.length - 1)];
  if (next === cam.zoom) return;
  const before = screenToWorld(e.clientX, e.clientY);
  cam.zoom = next;
  const after = screenToWorld(e.clientX, e.clientY);
  if (!cam.follow) { cam.x += before.x - after.x; cam.y += before.y - after.y; }
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); setSpeed(game.speedIndex ? 0 : game.lastSpeed); }
  else if ('1234'.includes(k) && k.length === 1) setSpeed(+k);
  else if (k === 'g') game.debug = !game.debug;
  else if (k === 'f') { if (game.selected) { cam.follow = !cam.follow; updateUI(); } }
  else if (k === 'escape') select(0);
  else keys.add(k);
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());
window.addEventListener('resize', resize);
document.querySelectorAll('#speed button').forEach(b => b.addEventListener('click', () => { setSpeed(+b.dataset.speed); b.blur(); }));
$('i-close').addEventListener('click', () => select(0));
$('i-follow').addEventListener('click', e => { cam.follow = !cam.follow; updateUI(); e.currentTarget.blur(); });

function updateCamera(realDt) {
  const pan = 420 / cam.zoom * realDt;
  if (keys.has('arrowleft') || keys.has('a')) { cam.x -= pan; cam.follow = false; }
  if (keys.has('arrowright') || keys.has('d')) { cam.x += pan; cam.follow = false; }
  if (keys.has('arrowup') || keys.has('w')) { cam.y -= pan; cam.follow = false; }
  if (keys.has('arrowdown') || keys.has('s')) { cam.y += pan; cam.follow = false; }
  const th = cam.follow && world.thrimps.find(t => t.id === game.selected);
  if (th) {
    const home = th.hidden && world.byId.get(th.home);
    const tx = home ? home.x : th.x, ty = home ? home.y : th.y - 12;
    cam.x = lerp(cam.x, tx, Math.min(1, realDt * 5));
    cam.y = lerp(cam.y, ty, Math.min(1, realDt * 5));
  }
  const hw = viewW / 2 / cam.zoom, hh = viewH / 2 / cam.zoom;
  cam.x = hw * 2 >= MAP_W ? MAP_W / 2 : clamp(cam.x, hw, MAP_W - hw);
  cam.y = hh * 2 >= MAP_H ? MAP_H / 2 : clamp(cam.y, hh, MAP_H - hh);
}

// ============================================================
// MAIN LOOP: fixed-step simulation, decoupled from rendering
// ============================================================
let acc = 0, lastNow = 0, lastUi = 0;
function frame(now) {
  const realDt = Math.min(0.25, (now - lastNow) / 1000); // no catch-up after the tab was hidden
  lastNow = now;
  const stepLen = 1 / CONFIG.TICK_HZ;
  acc += realDt * CONFIG.SPEEDS[game.speedIndex];
  let steps = 0;
  while (acc >= stepLen && steps < CONFIG.MAX_STEPS_PER_FRAME) {
    for (const th of world.thrimps) { th.px = th.x; th.py = th.y; }
    tick(world);
    acc -= stepLen;
    steps++;
  }
  if (steps >= CONFIG.MAX_STEPS_PER_FRAME) acc = 0;
  updateCamera(realDt);
  render(clamp(acc / stepLen, 0, 1));
  if (now - lastUi > 200) { updateUI(); lastUi = now; }
  requestAnimationFrame(frame);
}

function init() {
  resize();
  world = generateWorld();
  sprites = buildSprites(P);
  for (const [name, src] of Object.entries(THRIMP_SHEETS)) loadThrimpSheet(name, src);
  world.ground = paintGround(world, P);
  cam.x = world.center.x;
  cam.y = world.center.y + 20;
  updateUI();
  lastNow = performance.now();
  requestAnimationFrame(frame);
}
init();
// Console handle for poking at the sim while developing.
window.thrimp = {
  get world() { return world; }, CONFIG, setSpeed, select,
  run(minutes) { // fast-forward the sim without rendering
    for (let i = Math.round(minutes / CONFIG.MIN_PER_TICK); i > 0; i--) {
      for (const th of world.thrimps) { th.px = th.x; th.py = th.y; }
      tick(world);
    }
  },
};
</script>
</body>
